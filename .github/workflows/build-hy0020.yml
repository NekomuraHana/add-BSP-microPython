name: Build HY0020 MicroPython BSP

on:
  workflow_dispatch:

  pull_request:
    paths:
      - ".github/workflows/build-hy0020.yml"
      - "boards/nrf52/hy0020/**"
      - "scripts/merge_hy0020_swd.py"
      - "patches/micropython/nrf-uart-pin-selection.patch"
      - "patches/micropython/nrf-ble-central-gatt.patch"
      - "patches/micropython/nrf-ble-raw-uuid.patch"
      - "patches/micropython/nrf-ble-declaration-handle.patch"
      - "patches/micropython/nrf-spi-i2c-resource-management.patch"
      - "patches/micropython/nrf-early-uart-repl-select.patch"
      - "patches/micropython/nrf-hy0020-unhandled-errorlog.patch"
      - "micropython"

  push:
    branches:
      - main
    tags:
      - 'HY0020-V*'
    paths:
      - ".github/workflows/build-hy0020.yml"
      - "boards/nrf52/hy0020/**"
      - "scripts/merge_hy0020_swd.py"
      - "patches/micropython/nrf-uart-pin-selection.patch"
      - "patches/micropython/nrf-ble-central-gatt.patch"
      - "patches/micropython/nrf-ble-raw-uuid.patch"
      - "patches/micropython/nrf-ble-declaration-handle.patch"
      - "patches/micropython/nrf-spi-i2c-resource-management.patch"
      - "patches/micropython/nrf-early-uart-repl-select.patch"
      - "patches/micropython/nrf-hy0020-unhandled-errorlog.patch"
      - "micropython"

permissions:
  contents: read

jobs:
  hy0020:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/HY0020-V')
    name: HY0020 / AE-HY0020-DIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply shared nRF UART/BLE patches and HY0020 startup patch
        working-directory: micropython
        run: |
          git apply ../patches/micropython/nrf-uart-pin-selection.patch
          git apply ../patches/micropython/nrf-ble-central-gatt.patch
          git apply ../patches/micropython/nrf-ble-raw-uuid.patch
          git apply ../patches/micropython/nrf-ble-declaration-handle.patch
          git apply ../patches/micropython/nrf-early-uart-repl-select.patch
          git apply --check ../patches/micropython/nrf-hy0020-unhandled-errorlog.patch
          git apply ../patches/micropython/nrf-hy0020-unhandled-errorlog.patch
          git apply --check ../patches/micropython/nrf-spi-i2c-resource-management.patch
          git apply ../patches/micropython/nrf-spi-i2c-resource-management.patch

      - name: Check SWD image generator syntax
        run: python3 -m py_compile scripts/merge_hy0020_swd.py

      - name: Setup nRF build environment
        working-directory: micropython
        run: ./tools/ci.sh nrf_setup

      - name: Stage HY0020 BSP
        run: |
          rm -rf micropython/ports/nrf/boards/HY0020
          mkdir -p micropython/ports/nrf/boards/HY0020
          cp boards/nrf52/hy0020/mpconfigboard.h \
             boards/nrf52/hy0020/mpconfigboard.mk \
             boards/nrf52/hy0020/pins.csv \
             boards/nrf52/hy0020/hy0020_adafruit_bootloader.ld \
             boards/nrf52/hy0020/hy0020_standalone.ld \
             boards/nrf52/hy0020/manifest.py \
             boards/nrf52/hy0020/manifest_standalone.py \
             boards/nrf52/hy0020/board_info.py \
             boards/nrf52/hy0020/_hy0020_errorlog.py \
             boards/nrf52/hy0020/_boot.py \
             micropython/ports/nrf/boards/HY0020/
          cp -r boards/nrf52/hy0020/variant_dfu \
                boards/nrf52/hy0020/variant_standalone \
                micropython/ports/nrf/boards/HY0020/

      - name: Download S132 SoftDevice
        working-directory: micropython
        run: ports/nrf/drivers/bluetooth/download_ble_stack.sh s132_nrf52_6_1_1

      - name: Build mpy-cross
        working-directory: micropython
        run: make -C mpy-cross -j$(nproc)

      - name: Fetch nRF submodules
        working-directory: micropython
        run: make -C ports/nrf submodules -j$(nproc)

      - name: Build HY0020
        working-directory: micropython
        run: make -C ports/nrf BOARD=HY0020 SD=s132 -j$(nproc)

      - name: Install DFU tooling
        run: |
          python3 -m pip install --user adafruit-nrfutil intelhex
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify application flash range
        run: |
          python3 - <<'PY'
          from intelhex import IntelHex

          path = "micropython/ports/nrf/build-HY0020-s132/firmware.hex"
          image = IntelHex(path)
          addresses = image.addresses()
          if not addresses:
              raise SystemExit("firmware.hex contains no data")

          start = min(addresses)
          end = max(addresses) + 1
          print(f"Application HEX range: 0x{start:05X}-0x{end - 1:05X}")

          if start < 0x26000:
              raise SystemExit("application overlaps S132")
          app_start = 0x26000
          fs_start = 0x64000
          fs_end = 0x74000
          flash_end = 0x80000
          expected_fs_size = 64 * 1024
          assert fs_end - fs_start == expected_fs_size
          assert fs_end <= flash_end
          if start != app_start:
              raise SystemExit(f"unexpected application start: 0x{start:05X}")
          if end > fs_start:
              raise SystemExit(f"application overlaps filesystem at 0x{fs_start:05X}")
          app_capacity = fs_start - app_start
          app_used = end - app_start
          app_free = fs_start - end
          print(f"Application reserved: {app_capacity / 1024:.1f} KiB")
          print(f"Application used:     {app_used / 1024:.1f} KiB ({app_used / app_capacity:.1%})")
          print(f"Application headroom: {app_free / 1024:.1f} KiB")
          print(f"Filesystem reserved:  {expected_fs_size / 1024:.1f} KiB (0x{fs_start:05X}-0x{fs_end - 1:05X})")
          PY

      - name: Build serial DFU package
        run: |
          adafruit-nrfutil dfu genpkg \
            --dev-type 0x0052 \
            --sd-req 0x00B7 \
            --application micropython/ports/nrf/build-HY0020-s132/firmware.hex \
            micropython/ports/nrf/build-HY0020-s132/firmware-dfu.zip

      - name: Show firmware size
        run: |
          arm-none-eabi-size micropython/ports/nrf/build-HY0020-s132/firmware.elf
          ls -lh micropython/ports/nrf/build-HY0020-s132/

      # A single-file, unarchived artifact avoids nesting the DFU ZIP inside
      # GitHub's automatically generated artifact ZIP.
      # With archive: false, the artifact is named after its source filename.
      - name: Upload serial DFU ZIP (direct download)
        uses: actions/upload-artifact@v7
        with:
          path: micropython/ports/nrf/build-HY0020-s132/firmware-dfu.zip
          archive: false
          if-no-files-found: error

      - name: Upload development firmware
        uses: actions/upload-artifact@v7
        with:
          name: fdk-hy0020-micropython-debug
          path: |
            micropython/ports/nrf/build-HY0020-s132/firmware.hex
            micropython/ports/nrf/build-HY0020-s132/firmware.bin
            micropython/ports/nrf/build-HY0020-s132/firmware.elf
          if-no-files-found: error

      # Separate build directory keeps the existing Adafruit DFU binaries intact.
      - name: Build bootloader-free HY0020 for SWD
        working-directory: micropython
        run: |
          make -C ports/nrf BOARD=HY0020 SD=s132 \
            HY0020_NO_BOOTLOADER=1 BUILD=build-HY0020-s132-standalone -j$(nproc)

      - name: Verify standalone flash layout and create SWD image
        run: |
          python3 - <<'PY'
          from intelhex import IntelHex
          image = IntelHex("micropython/ports/nrf/build-HY0020-s132-standalone/firmware.hex")
          addresses = image.addresses()
          if not addresses or min(addresses) != 0x26000 or max(addresses) >= 0x68000:
              raise SystemExit("Standalone app must fit 0x26000..0x67FFF")
          print(f"Standalone application: 0x{min(addresses):05X}-0x{max(addresses):05X}")
          print("LFS2 reserved: 0x68000-0x7FFFF (96 KiB)")
          PY
          python3 scripts/merge_hy0020_swd.py \
            micropython/ports/nrf/drivers/bluetooth/s132_nrf52_6.1.1/s132_nrf52_6.1.1_softdevice.hex \
            micropython/ports/nrf/build-HY0020-s132-standalone/firmware.hex \
            micropython/ports/nrf/build-HY0020-s132-standalone/hy0020-s132-micropython-swd.hex

      - name: Upload bootloader-free SWD firmware
        uses: actions/upload-artifact@v7
        with:
          name: fdk-hy0020-micropython-swd
          path: |
            micropython/ports/nrf/build-HY0020-s132-standalone/firmware.hex
            micropython/ports/nrf/build-HY0020-s132-standalone/firmware.bin
            micropython/ports/nrf/build-HY0020-s132-standalone/firmware.elf
            micropython/ports/nrf/build-HY0020-s132-standalone/hy0020-s132-micropython-swd.hex
          if-no-files-found: error

      # Package the exact verified build outputs; also exercise packaging in PR CI.
      - name: Prepare release binaries
        run: |
          mkdir -p release
          cp micropython/ports/nrf/build-HY0020-s132/firmware-dfu.zip release/fdk-hy0020-micropython-dfu.zip
          cp micropython/ports/nrf/build-HY0020-s132-standalone/hy0020-s132-micropython-swd.hex release/fdk-hy0020-micropython-swd.hex
          cd release
          sha256sum fdk-hy0020-micropython-dfu.zip fdk-hy0020-micropython-swd.hex > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: fdk-hy0020-micropython-release
          path: release/
          if-no-files-found: error

  release:
    name: Publish HY0020 firmware
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/HY0020-V')
    needs: hy0020
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: fdk-hy0020-micropython-release
          path: release

      - name: Verify release checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## HY0020 / AE-HY0020-DIP MicroPython firmware

          - `fdk-hy0020-micropython-dfu.zip` — Adafruit bootloaderあり、シリアルDFU更新用
          - `fdk-hy0020-micropython-swd.hex` — bootloader不要、S132とMicroPythonを含むSWD/J-Link一括書き込み用
          - `SHA256SUMS.txt` — ダウンロードファイルの検証用

          REPL UARTは両版ともTX=P0.18 / RX=P0.16 (115200 bps)。
          REPL選択ピンはDFU版がP0.12、SWD版がP0.20 (LOWでREPL)。
          DFU UARTは従来どおりTX=P0.06 / RX=P0.08、DFU選択はP0.20。

          **注意:** SWD版への切り替えでは既存bootloaderの消去が必要です。書き込み方法によって既存データや設定が失われるため、事前にバックアップしてください。DFU ZIPは展開せず使用してください。
          EOF
          gh release create "$TAG" release/* --verify-tag --title "HY0020 MicroPython $TAG" --notes-file release-notes.md
