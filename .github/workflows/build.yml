name: Build MicroPython BSP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  isp1807:
    name: ISP1807-LR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Use the same ARM toolchain setup as the upstream MicroPython nRF CI.
      - name: Setup official MicroPython nRF build environment
        working-directory: micropython
        run: ./tools/ci.sh nrf_setup

      - name: Build ISP1807-LR
        run: python3 scripts/build.py isp1807

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: isp1807-lr-micropython
          path: |
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.hex
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.bin
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.elf
          if-no-files-found: error
