name: Build MicroPython BSP

on:
  workflow_dispatch:

  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "boards/nrf52/isp1807/**"
      - "scripts/verify_isp1807_firmware.py"
      - "scripts/verify_isp1807_uf2.py"
      - "scripts/merge_isp1807_swd.py"
      - "patches/micropython/**"
      - "micropython"

  # PR branches are built by pull_request above. Build pushes only after they
  # land on main so the same commit is not built twice while a PR is open.
  push:
    branches:
      - main
    tags:
      - 'ISP1807-V*'
    paths:
      - ".github/workflows/build.yml"
      - "boards/nrf52/isp1807/**"
      - "scripts/verify_isp1807_firmware.py"
      - "scripts/verify_isp1807_uf2.py"
      - "patches/micropython/**"
      - "micropython"

permissions:
  contents: read

jobs:
  isp1807:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/ISP1807-V')
    name: ISP1807-LR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Same compiler/toolchain setup used by upstream MicroPython nRF CI.
      - name: Apply MicroPython patches
        working-directory: micropython
        run: |
          git apply ../patches/micropython/nrf-uart-pin-selection.patch
          git apply --check ../patches/micropython/nrf-ble-central-gatt.patch
          git apply ../patches/micropython/nrf-ble-central-gatt.patch
          git apply --check ../patches/micropython/nrf-ble-raw-uuid.patch
          git apply ../patches/micropython/nrf-ble-raw-uuid.patch
          git apply --check ../patches/micropython/nrf-ble-declaration-handle.patch
          git apply ../patches/micropython/nrf-ble-declaration-handle.patch

      - name: Setup nRF build environment
        working-directory: micropython
        run: ./tools/ci.sh nrf_setup

      - name: Stage ISP1807 BSP
        run: |
          rm -rf micropython/ports/nrf/boards/ISP1807_LR
          mkdir -p micropython/ports/nrf/boards/ISP1807_LR
          cp boards/nrf52/isp1807/mpconfigboard.h \
             boards/nrf52/isp1807/mpconfigboard.mk \
             boards/nrf52/isp1807/pins.csv \
             boards/nrf52/isp1807/isp1807_breakout_bootloader.ld \
             boards/nrf52/isp1807/manifest.py \
             boards/nrf52/isp1807/_boot.py \
             micropython/ports/nrf/boards/ISP1807_LR/

      - name: Download S140 SoftDevice
        working-directory: micropython
        run: ports/nrf/drivers/bluetooth/download_ble_stack.sh s140_nrf52_6_1_1

      - name: Build mpy-cross
        working-directory: micropython
        run: make -C mpy-cross -j$(nproc)

      - name: Fetch nRF submodules
        working-directory: micropython
        run: make -C ports/nrf submodules -j$(nproc)

      - name: Build ISP1807-LR
        working-directory: micropython
        run: make -C ports/nrf BOARD=ISP1807_LR SD=s140 -j$(nproc)

      - name: Verify firmware layout and USB descriptor
        run: |
          python3 scripts/verify_isp1807_firmware.py \
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.bin

      - name: Build UF2 image
        run: |
          python3 micropython/tools/uf2conv.py \
            -c \
            -f 0xADA52840 \
            -o micropython/ports/nrf/build-ISP1807_LR-s140/firmware.uf2 \
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.hex

          python3 scripts/verify_isp1807_uf2.py \
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.uf2

      - name: Build serial DFU package
        run: |
          python3 -m pip install --user adafruit-nrfutil
          export PATH="$HOME/.local/bin:$PATH"
          adafruit-nrfutil dfu genpkg \
            --dev-type 0x0052 \
            --sd-req 0xB6 \
            --application micropython/ports/nrf/build-ISP1807_LR-s140/firmware.hex \
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware-dfu.zip

      # A second link reuses the same board, pins, S140 and BLE stack while
      # reclaiming the tail previously reserved for the UF2/DFU bootloader.
      - name: Build bootloader-free application for SWD
        working-directory: micropython
        run: |
          make -C ports/nrf BOARD=ISP1807_LR SD=s140 \
            ISP1807_NO_BOOTLOADER=1 BUILD=build-ISP1807_LR-s140-standalone -j$(nproc)

      - name: Verify standalone application and create one-shot SWD HEX
        run: |
          python3 scripts/verify_isp1807_firmware.py --standalone \
            micropython/ports/nrf/build-ISP1807_LR-s140-standalone/firmware.bin
          python3 -m pip install --user intelhex
          python3 scripts/merge_isp1807_swd.py \
            micropython/ports/nrf/drivers/bluetooth/s140_nrf52_6.1.1/s140_nrf52_6.1.1_softdevice.hex \
            micropython/ports/nrf/build-ISP1807_LR-s140-standalone/firmware.hex \
            micropython/ports/nrf/build-ISP1807_LR-s140-standalone/isp1807-s140-micropython-swd.hex

      - name: Show firmware
        run: ls -lh micropython/ports/nrf/build-ISP1807_LR-s140/ micropython/ports/nrf/build-ISP1807_LR-s140-standalone/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: isp1807-lr-micropython
          path: |
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.hex
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.bin
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.elf
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware.uf2
            micropython/ports/nrf/build-ISP1807_LR-s140/firmware-dfu.zip
          if-no-files-found: error

      - name: Upload bootloader-free SWD firmware
        uses: actions/upload-artifact@v4
        with:
          name: isp1807-lr-micropython-swd
          path: |
            micropython/ports/nrf/build-ISP1807_LR-s140-standalone/firmware.hex
            micropython/ports/nrf/build-ISP1807_LR-s140-standalone/firmware.bin
            micropython/ports/nrf/build-ISP1807_LR-s140-standalone/firmware.elf
            micropython/ports/nrf/build-ISP1807_LR-s140-standalone/isp1807-s140-micropython-swd.hex
          if-no-files-found: error

  release:
    name: Publish ISP1807 firmware
    if: startsWith(github.ref, 'refs/tags/ISP1807-V')
    needs: isp1807
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: isp1807-lr-micropython
          path: artifacts/uf2

      - name: Download SWD firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: isp1807-lr-micropython-swd
          path: artifacts/swd

      - name: Prepare release binaries
        run: |
          mkdir -p release
          cp artifacts/uf2/firmware.uf2 release/isp1807-lr-micropython-uf2.uf2
          cp artifacts/uf2/firmware-dfu.zip release/isp1807-lr-micropython-dfu.zip
          cp artifacts/swd/isp1807-s140-micropython-swd.hex release/isp1807-lr-micropython-swd.hex
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## ISP1807-LR MicroPython firmware

          - `isp1807-lr-micropython-uf2.uf2` — UF2 bootloaderが入ったボード用
          - `isp1807-lr-micropython-dfu.zip` — シリアルDFU更新用
          - `isp1807-lr-micropython-swd.hex` — bootloader不要、S140とMicroPythonを含むSWD/J-Link一括書き込み用
          - `SHA256SUMS.txt` — ダウンロードファイルの検証用

          **注意:** SWD版は全領域を書き込むため、既存の書き込み内容が消える場合があります。書き込み方法に合ったファイルを選んでください。
          EOF
          gh release create "$TAG" release/* --verify-tag --title "ISP1807-LR MicroPython $TAG" --notes-file release-notes.md
