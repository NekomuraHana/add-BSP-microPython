name: Hardware test script checks

on:
  pull_request:
    paths:
      - "tests/**"
      - ".github/workflows/hardware-test-syntax.yml"
  push:
    branches: [main]
    paths:
      - "tests/**"
      - ".github/workflows/hardware-test-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile scripts (syntax only, no attached hardware)
        run: python3 -m compileall -q tests
      - name: Verify SHT3x CRC-8 known example
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          path = pathlib.Path("tests/common/i2c_sht3x.py")
          source = ast.parse(path.read_text())
          func = next(node for node in source.body if isinstance(node, ast.FunctionDef) and node.name == "crc8")
          ns = {}
          exec(compile(ast.Module(body=[func], type_ignores=[]), str(path), "exec"), ns)
          assert ns["crc8"](bytes([0xBE, 0xEF])) == 0x92
          PY
